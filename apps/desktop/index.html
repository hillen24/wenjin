<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E14" id="meta-theme" />
    <title>问津 · 思想栖所</title>
    <script>
      /* 主题必须在首屏渲染前落地，否则暗色用户会看到一帧白闪。
         这段必须内联、必须早于任何样式表求值，所以留在 HTML 里而不是打进 bundle。 */
      (function () {
        try {
          var t = localStorage.getItem('wj_theme');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch (e) {
          /* 隐私模式下 localStorage 不可用，用默认暗色即可 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
